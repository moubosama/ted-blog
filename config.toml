baseURL = "https://moubosama.github.io/ted-blog/"
languageCode = "ja"
title = "TED Talks、すぐわかる解説"
theme = "Mainroad"
defaultContentLanguage = "ja"
[pagination]
  pagerSize = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
googleAnalytics = "G-250W10J60X"

[Author]
  name = "TED Talks、すぐわかる解説"
  bio = "世界の専門家プレゼン「TED Talks」を、3分で読める日本語解説にしてお届け。"

[Params]
  description = "TED Talksを3分でわかる日本語解説に。仕事・お金・健康・習慣、明日使えるネタだけ厳選。"
  opengraph = true
  schema = true
  twitter_cards = true
  readmore = true
  authorbox = false
  pager = true
  toc = true
  post_meta = ["date", "categories"]
  mainSections = ["posts"]
  googleFontsLink = "https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap"
  customCSS = ["css/custom.css"]

[Params.logo]
  subtitle = "3分で読める、明日使えるTED解説"

[Params.sidebar]
  home = "false"
  list = "right"
  single = "right"
  widgets = ["search", "recent", "categories", "taglist"]

[Params.widgets]
  recent_num = 5
  tags_counter = true

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"
  category = "categories"

[menu]
  [[menu.main]]
    identifier = "home"
    name = "ホーム"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "tags"
    name = "タグ"
    url = "/tags/"
    weight = 2
  [[menu.main]]
    identifier = "categories"
    name = "カテゴリ"
    url = "/categories/"
    weight = 3
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 4
  [[menu.main]]
    identifier = "contact"
    name = "お問い合わせ"
    url = "/contact/"
    weight = 5
  [[menu.main]]
    identifier = "privacy"
    name = "プライバシーポリシー"
    url = "/privacy/"
    weight = 6
