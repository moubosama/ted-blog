<!-- Google Fonts: Noto Sans JP -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

{{- $desc := .Description | default (.Summary | plainify) | default .Site.Params.description -}}

<!-- OGP -->
<meta property="og:site_name" content="TED要約ラボ">
<meta property="og:locale" content="ja_JP">
{{ if .IsPage }}
<meta property="og:type" content="article">
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:url" content="{{ .Permalink }}">
{{ with .Params.speaker }}<meta property="article:author" content="{{ . }}">{{ end }}
{{ else }}
<meta property="og:type" content="website">
<meta property="og:title" content="{{ .Site.Title }}">
<meta property="og:description" content="{{ .Site.Params.description }}">
<meta property="og:url" content="{{ .Site.BaseURL }}">
{{ end }}

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title | default .Site.Title }}">
<meta name="twitter:description" content="{{ $desc }}">

<!-- JSON-LD 構造化データ -->
{{ if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ .Title | jsonify }},
  "description": {{ $desc | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "author": {
    "@type": "Organization",
    "name": "TED要約ラボ"
  },
  "publisher": {
    "@type": "Organization",
    "name": "TED要約ラボ"
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink | jsonify }}
  }
  {{ with .Params.original_url }},
  "isBasedOn": {
    "@type": "VideoObject",
    "name": {{ $.Params.speaker | default "TED Speaker" | printf "%s - TED Talk" | jsonify }},
    "url": {{ . | jsonify }}
  }
  {{ end }}
}
</script>
{{ end }}
